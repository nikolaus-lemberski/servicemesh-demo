apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: services-gateway
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: service-a
spec:
  parentRefs:
  - name: services-gateway
  rules:
  - matches:
    - path:
        type: Exact
        value: /service-a
    backendRefs:
    - name: service-a
      port: 8080